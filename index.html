
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#74d9f6">
  <title>펭귄마트 2 - 아준이의 만능 자판기</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="app">

    <!-- 시작 화면 -->
    <section id="startScreen" class="screen start-screen">
      <div class="start-art">
        <div class="penguin-big">🐧</div>
        <div class="floating-items">🚗 🍦 🚄 🎁</div>
      </div>

      <h1>펭귄마트 2</h1>
      <p class="subtitle">아준이의 만능 자판기</p>
      <p class="intro">
        가족 손님들의 주문을 받고<br>
        맛있는 음식과 장난감을 판매해요!
      </p>

      <div class="start-buttons">
        <button id="easyBtn" class="mode-btn easy">
          <span class="mode-icon">🌸</span>
          <span>이서 쉬움</span>
          <small>물건 하나씩 판매하기</small>
        </button>

        <button id="hardBtn" class="mode-btn hard">
          <span class="mode-icon">🚄</span>
          <span>아준 도전</span>
          <small>조합 주문과 돌발 미션!</small>
        </button>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="gameScreen" class="screen hidden">

      <header class="game-header">
        <div class="brand">🐧 펭귄마트</div>
        <div class="score-area">
          <span id="levelText">⭐ 1단계</span>
          <span id="coinText">🪙 0</span>
          <span id="successText">🎁 0</span>
        </div>
        <button id="homeBtn" class="small-btn">🏠</button>
      </header>

      <div class="game-layout">

        <!-- 손님과 주문 -->
        <section class="customer-panel">
          <div class="customer-scene">
            <div id="customerAvatar" class="customer-avatar">👦</div>
            <div class="penguin-clerk">🐧</div>
          </div>

          <div class="customer-name" id="customerName">아준이</div>

          <div class="order-box">
            <div class="order-title">📢 손님의 주문</div>
            <div id="orderMessage" class="order-message">
              주문을 준비하고 있어요!
            </div>
            <div id="orderIcons" class="order-icons"></div>
          </div>

          <div id="eventBox" class="event-box hidden">
            <div id="eventTitle" class="event-title"></div>
            <div id="eventMessage"></div>
            <div id="eventChoices" class="event-choices"></div>
          </div>

          <div class="customer-actions">
            <button id="repeatBtn" class="action-btn repeat">
              🔊 다시 듣기
            </button>
            <button id="nextBtn" class="action-btn next hidden">
              ➡️ 다음 손님
            </button>
          </div>
        </section>

        <!-- 자판기 -->
        <section class="machine-panel">
          <div class="machine-top">
            <span>🐧 PENGUIN MART</span>
            <span id="machineStatus">🟢 영업 중</span>
          </div>

          <div class="machine-display">
            <div class="display-heading">
              <span>🛒 오늘의 상품</span>
              <span id="selectionCount">0개 선택</span>
            </div>
            <div id="productGrid" class="product-grid"></div>
          </div>

          <div class="machine-controls">
            <div class="basket-title">🧺 선택한 물건</div>
            <div id="basket" class="basket">물건을 눌러 주세요!</div>
            <div class="control-buttons">
              <button id="clearBtn" class="control-btn clear">
                ↩️ 다시 고르기
              </button>
              <button id="sellBtn" class="control-btn sell">
                🎁 판매하기!
              </button>
            </div>
          </div>

          <div class="delivery-slot">
            <span>📦 상품 나오는 곳</span>
            <div id="deliveryItem" class="delivery-item">✨</div>
          </div>
        </section>

      </div>

      <div id="feedback" class="feedback hidden">
        <div class="feedback-card">
          <div id="feedbackIcon" class="feedback-icon">🎉</div>
          <h2 id="feedbackTitle">성공!</h2>
          <p id="feedbackMessage"></p>
          <button id="feedbackBtn" class="feedback-btn">
            계속하기 ➡️
          </button>
        </div>
      </div>

    </section>
  </main>
</body>
</html>
